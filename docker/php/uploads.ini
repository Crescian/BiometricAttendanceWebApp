; Biometric files (CSV/XLSX) are uploaded on Biometric Data Import. The reverse proxy allows 25M
; (client_max_body_size in nginx-proxy/conf.d/attendance.conf); keep post_max_size within it.
upload_max_filesize = 20M
post_max_size = 25M
; Large uploads and payroll generation (see CLAUDE.md, Production settings)
max_execution_time = 120
; PhpSpreadsheet needs many times the file size in memory to read an XLSX
memory_limit = 512M
